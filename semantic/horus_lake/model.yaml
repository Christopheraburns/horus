version: 0.2.0.dev0
name: horus_lake
description: 'Horus lake: Horus''s observations, typed per kind of thing (horus_dev_views). Generated by helios run 20261120T213130Z.'
ai_context:
  instructions: Semantic model generated by helios from warehouse evidence and reviewed by a human. Field labels are business
    names; custom_extensions carry helios provenance.
datasets:
- name: aircraft_positions
  source: horus_dev_views.aircraft_positions
  description: Records of aircraft position observations captured from ADS-B data feeds, including geographic coordinates,
    altitude, speed, heading, and aircraft identification details for each timestamped event.
  fields:
  - name: event_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: event_id
    label: Event ID
    description: The source's id for what it reported (provider:originalId). Repeats across reports of the same thing; with
      event_time it identifies a report, and obs_hash is that pair's key.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"attribute","engine_type":"varchar","confidence":0.9}'
  - name: obs_hash
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: obs_hash
    label: Observation hash
    description: 'The observation''s key: SHA-256 of event_id and the event time in milliseconds. One row per value (the lake''s
      dedupe key).'
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"identifier","engine_type":"varchar","confidence":0.9}'
  - name: lat
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lat
    label: Latitude
    description: Latitude in decimal degrees (WGS84).
    datatype: Float
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"attribute","engine_type":"double","confidence":0.95}'
  - name: lon
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lon
    label: Longitude
    description: Longitude in decimal degrees (WGS84).
    datatype: Float
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"attribute","engine_type":"double","confidence":0.95}'
  - name: tile_z8
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tile_z8
    label: Map tile
    description: Identifier for the zoom-8 map tile containing the aircraft position, used for spatial grouping and filtering.
    datatype: Integer
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"integer","confidence":0.85}'
  - name: event_time
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: event_time
    label: Event time
    description: Timestamp when the aircraft position was observed by the sensor.
    datatype: DateTime
    dimension:
      is_time: true
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"time","engine_type":"timestamp(6)","confidence":0.95}'
  - name: captured_at
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: captured_at
    label: Captured at
    description: Timestamp when the position data was ingested or captured by the system.
    datatype: DateTime
    dimension:
      is_time: true
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"time","engine_type":"timestamp(6)","confidence":0.9}'
  - name: source_provider
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: source_provider
    label: Source provider
    description: The external data provider that supplied the aircraft position observation.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"varchar","confidence":0.9}'
  - name: classification
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: classification
    label: Classification
    description: Security marking (burndown section 13); UNCLASSIFIED today.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"varchar","confidence":0.8}'
  - name: releasability
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: releasability
    label: Releasability
    description: Who the record may be shared with (burndown section 13); not yet set.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"varchar","confidence":0.5}'
  - name: icao24
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: icao24
    label: ICAO 24-bit address
    description: The ICAO 24-bit transponder address (6 hex digits); null for non-ICAO ids. Assigned with the registration
      and reissued over time. A claim as the source sent it, unchecked (docs/IDENTITY.md).
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"varchar","confidence":0.95}'
  - name: asset_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: asset_id
    label: Asset ID
    description: 'The id the source reported for the aircraft: an ICAO 24-bit address, or adsb.lol''s own (~ prefix) for non-ICAO
      transponders; see id_scheme. A claim as the source sent it, unchecked (docs/IDENTITY.md).'
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"varchar","confidence":0.8}'
  - name: id_scheme
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_scheme
    label: ID scheme
    description: The identification scheme or standard used for the asset identifier.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"varchar","confidence":0.85}'
  - name: callsign
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: callsign
    label: Callsign
    description: The radio callsign used by the aircraft during the flight.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"attribute","engine_type":"varchar","confidence":0.9}'
  - name: registration
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: registration
    label: Registration
    description: The official registration number (tail number) of the aircraft.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"attribute","engine_type":"varchar","confidence":0.95}'
  - name: aircraft_model
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: aircraft_model
    label: Aircraft model
    description: The model designation of the aircraft, such as A109 or B738.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"attribute","engine_type":"varchar","confidence":0.9}'
  - name: flight_category
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: flight_category
    label: Flight category
    description: 'Horus''s flight category: commercial, private, jet or military (from type, flags and callsign).'
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"varchar","confidence":0.95}'
  - name: airline_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: airline_code
    label: Airline code
    description: The IATA or ICAO code identifying the operating airline.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"attribute","engine_type":"varchar","confidence":0.9}'
  - name: squawk
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: squawk
    label: Squawk code
    description: The four-digit transponder code set by the pilot for air traffic control.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"attribute","engine_type":"varchar","confidence":0.9}'
  - name: alt_m
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: alt_m
    label: Altitude
    description: Altitude of the aircraft above sea level in meters.
    datatype: Float
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"measure","engine_type":"double","confidence":0.95}'
  - name: speed_mps
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: speed_mps
    label: Speed (m/s)
    description: Ground speed of the aircraft in meters per second.
    datatype: Float
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"measure","engine_type":"double","confidence":0.95}'
  - name: speed_kn
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: speed_kn
    label: Speed (knots)
    description: Ground speed of the aircraft in knots.
    datatype: Float
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"measure","engine_type":"double","confidence":0.95}'
  - name: course_deg
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: course_deg
    label: Course
    description: Track over ground, degrees clockwise from true north (aircraft feeds report no heading).
    datatype: Float
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"measure","engine_type":"double","confidence":0.95}'
  - name: on_ground
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: on_ground
    label: On ground
    description: Indicates whether the aircraft is on the ground (true) or airborne (false).
    datatype: Boolean
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"boolean","confidence":0.95}'
  custom_extensions:
  - vendor_name: HELIOS
    data: '{"kind":"fact","confidence":0.95,"run_id":"20261120T213130Z"}'
- name: earthquakes
  source: horus_dev_views.earthquakes
  description: Records of individual earthquake events detected by USGS, capturing when and where each quake occurred along
    with its magnitude, depth, and impact indicators.
  fields:
  - name: event_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: event_id
    label: Event ID
    description: The quake's id (USGS:<id>); one quake per value. obs_hash identifies the report.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"identifier","engine_type":"varchar","confidence":0.95}'
  - name: obs_hash
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: obs_hash
    label: Observation hash
    description: 'The observation''s key: SHA-256 of event_id and the event time in milliseconds. One row per value (the lake''s
      dedupe key).'
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"identifier","engine_type":"varchar","confidence":0.8}'
  - name: lat
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lat
    label: Latitude
    description: Latitude in decimal degrees (WGS84).
    datatype: Float
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"attribute","engine_type":"double","confidence":0.95}'
  - name: lon
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lon
    label: Longitude
    description: Longitude in decimal degrees (WGS84).
    datatype: Float
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"attribute","engine_type":"double","confidence":0.95}'
  - name: tile_z8
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tile_z8
    label: Map tile (zoom 8)
    description: Geospatial tile identifier at zoom level 8 used for mapping and spatial indexing.
    datatype: Integer
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"integer","confidence":0.8}'
  - name: event_time
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: event_time
    label: Event time
    description: Date and time when the earthquake occurred.
    datatype: DateTime
    dimension:
      is_time: true
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"time","engine_type":"timestamp(6)","confidence":0.95}'
  - name: captured_at
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: captured_at
    label: Captured at
    description: Timestamp indicating when the earthquake record was ingested into the system.
    datatype: DateTime
    dimension:
      is_time: true
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"time","engine_type":"timestamp(6)","confidence":0.9}'
  - name: source_provider
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: source_provider
    label: Source provider
    description: Organization that provided the earthquake data (currently always USGS).
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"varchar","confidence":0.9}'
  - name: classification
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: classification
    label: Classification
    description: Security marking (burndown section 13); UNCLASSIFIED today.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"varchar","confidence":0.7}'
  - name: releasability
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: releasability
    label: Releasability
    description: Who the record may be shared with (burndown section 13); not yet set.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"varchar","confidence":0.6}'
  - name: place
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: place
    label: Place
    description: Human-readable description of the location near the earthquake epicenter (e.g., '1 km NNW of Commerce, CA').
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"varchar","confidence":0.95}'
  - name: quake_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: quake_type
    label: Quake type
    description: Type of seismic event recorded (e.g., earthquake).
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"varchar","confidence":0.8}'
  - name: magnitude
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: magnitude
    label: Magnitude
    description: Magnitude as USGS reports it; its magnitude type (Mw, ML, mb, ...) varies by event.
    datatype: Float
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"measure","engine_type":"double","confidence":0.99}'
  - name: depth_km
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: depth_km
    label: Depth (km)
    description: Depth of the earthquake hypocenter below the Earth's surface in kilometers.
    datatype: Float
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"measure","engine_type":"double","confidence":0.99}'
  - name: felt_reports
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: felt_reports
    label: Felt reports
    description: Number of public reports from people who felt the earthquake (null when no reports were submitted).
    datatype: Integer
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"measure","engine_type":"integer","confidence":0.9}'
  - name: tsunami_flag
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tsunami_flag
    label: Tsunami flag
    description: Indicator (0 or 1) showing whether the earthquake triggered a tsunami.
    datatype: Integer
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"integer","confidence":0.95}'
  - name: source_url
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: source_url
    label: Source URL
    description: URL to the original event page on the USGS website for detailed information.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"attribute","engine_type":"varchar","confidence":0.95}'
  custom_extensions:
  - vendor_name: HELIOS
    data: '{"kind":"fact","confidence":0.95,"run_id":"20261120T213130Z"}'
  ai_context:
    synonyms:
    - Earthquake events
